name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Validate JavaScript syntax
        run: npm run check:syntax

      - name: Validate extension manifest
        run: npm run check:manifest

      - name: Build and verify extension package
        run: npm run check:package

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: tabrenamer-extension-${{ github.sha }}
          path: dist/tabrenamer-v*.zip
          if-no-files-found: error
          retention-days: 14
