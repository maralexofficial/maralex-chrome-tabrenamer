<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Rename tab · TabRenamer</title>
    <link rel="stylesheet" href="./rename.css">
    <script type="module" src="./rename.js"></script>
  </head>
  <body>
    <main class="rename">
      <header>
        <h1>Rename tab</h1>
        <p id="page-name">Loading tab…</p>
      </header>
      <form id="rename-form">
        <label for="custom-title">Custom tab name</label>
        <input id="custom-title" name="customTitle" type="text" maxlength="80"
          placeholder="e.g. Project dashboard" autocomplete="off" required>
        <button id="save-button" type="submit">Save tab name</button>
      </form>
      <p id="status" role="status" aria-live="polite">Enter a name for this tab.</p>
    </main>
  </body>
</html>
