<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>TabRenamer</title>
    <link rel="stylesheet" href="./popup.css">
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>TabRenamer</h1>
          <p>Rename the active tab.</p>
        </div>
        <span id="active-label" class="popup__active" hidden>Active</span>
      </header>
      <section id="active-tab" class="active-tab" aria-live="polite">
        <p class="active-tab__loading">Loading active tab…</p>
      </section>
      <p id="status" class="popup__status" role="status" aria-live="polite"></p>
      <button id="manage-tabs" class="manage-button" type="button">
        Manage all tabs <span aria-hidden="true">↗</span>
      </button>
      <footer class="popup__footer">
        Custom names are stored for this browser session.
      </footer>
    </main>
  </body>
</html>
