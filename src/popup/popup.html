<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>TabRenamer</title>
    <link rel="stylesheet" href="./popup.css">
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>TabRenamer</h1>
        <p>Give the current tab a name you recognize.</p>
      </header>
      <section class="popup__panel">
        <p id="page-name" class="popup__page-name">Loading current tab…</p>
        <form id="rename-form">
          <label for="custom-title">Custom tab name</label>
          <input id="custom-title" name="customTitle" type="text" maxlength="80"
            placeholder="e.g. Project dashboard" autocomplete="off" required>
          <button id="save-button" type="submit">Save tab name</button>
        </form>
        <button id="restore-button" class="button button--secondary" type="button" disabled>
          Restore page title
        </button>
        <p id="status" class="popup__status" role="status" aria-live="polite">
          Website access is granted once in Chrome. No further site prompts are needed.
        </p>
      </section>
      <footer class="popup__footer">
        Website access is limited to the current site.
      </footer>
    </main>
  </body>
</html>
