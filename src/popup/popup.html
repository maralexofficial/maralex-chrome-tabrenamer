<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>TabRenamer</title>
    <link rel="stylesheet" href="./popup.css">
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>TabRenamer</h1>
          <p>Manage the names of your open tabs.</p>
        </div>
        <span id="tab-count" class="popup__count">…</span>
      </header>
      <p id="status" class="popup__status" role="status" aria-live="polite">
        Loading tabs…
      </p>
      <section id="tab-list" class="tab-list" aria-label="Open tabs">
        <p class="tab-list__empty">Loading tabs…</p>
      </section>
      <footer class="popup__footer">
        Names are stored separately for each tab during this browser session.
      </footer>
    </main>
  </body>
</html>
